<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RhythmRun – Run to the Beat</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=Space+Mono:wght@400;700&display=swap');
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'DM Sans',sans-serif;background:#0d0d1a;color:white;min-height:100vh}
    .screen{display:none;padding:20px 16px 48px;max-width:440px;margin:0 auto}
    .screen.active{display:block}
    #s-loading{justify-content:center;align-items:center;min-height:100vh;flex-direction:column;gap:16px}
    #s-loading.active{display:flex}
    .logo{font-size:26px;font-weight:800;letter-spacing:-1px;margin-top:24px;margin-bottom:4px}
    .logo span{color:#a855f7}
    .tagline{color:#666;font-size:13px;margin-bottom:28px}
    .sec{color:#555;font-size:11px;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px}
    .mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px}
    .mode-btn{background:#12122a;border:1px solid #2a2a4a;border-radius:14px;padding:16px 12px;cursor:pointer;text-align:center;color:white;transition:all 0.2s}
    .mode-btn:hover{transform:translateY(-1px)}
    .mode-btn.sel-run{border-color:#f97316;background:#f9731618}
    .mode-btn.sel-sprint{border-color:#ef4444;background:#ef444418}
    .m-title{font-size:14px;font-weight:700}
    .m-desc{font-size:11px;color:#888;margin-top:3px;font-family:'Space Mono',monospace}
    .ratio-list{display:flex;flex-direction:column;gap:8px;margin-bottom:24px}
    .ratio-btn{background:#12122a;border:1px solid #2a2a4a;border-radius:12px;padding:13px 16px;cursor:pointer;display:flex;align-items:center;gap:12px;color:white;font-family:inherit;transition:all 0.2s;width:100%}
    .ratio-btn:hover{transform:translateY(-1px)}
    .ratio-btn.sel{border-color:#a855f7;background:#a855f720}
    .rl{color:#a855f7;font-weight:700;font-size:15px;font-family:'Space Mono',monospace;min-width:38px}
    .rd{color:#bbb;font-size:13px}
    .dots{margin-left:auto;display:flex;gap:3px}
    .dw{width:14px;height:14px;border-radius:3px;background:#22c55e33;border:1.5px solid #22c55e}
    .da-run{width:14px;height:14px;border-radius:3px;background:#f9731633;border:1.5px solid #f97316}
    .da-sprint{width:14px;height:14px;border-radius:3px;background:#ef444433;border:1.5px solid #ef4444}
    .info-box{background:#12122a;border:1px solid #2a2a4a;border-radius:12px;padding:12px 14px;margin-bottom:20px;display:flex;gap:10px;font-size:12px;color:#888;line-height:1.6}
    .err-box{background:#ef444415;border:1px solid #ef444440;border-radius:10px;padding:10px 14px;margin-bottom:16px;color:#ef4444;font-size:13px;display:none}
    .start-btn{width:100%;background:linear-gradient(135deg,#a855f7,#6366f1);color:white;border:none;border-radius:16px;padding:16px 0;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;transition:all 0.2s}
    .start-btn:hover:not(:disabled){opacity:.88;transform:translateY(-2px)}
    .start-btn:disabled{opacity:.4;cursor:not-allowed}
    .spinner{width:40px;height:40px;border:3px solid #2a2a4a;border-top-color:#a855f7;border-radius:50%;animation:spin .8s linear infinite}
    .load-msg{color:#888;font-size:14px;text-align:center;max-width:280px}
    .wk-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;margin-top:8px}
    .live{display:flex;align-items:center;gap:7px;color:#22c55e;font-size:12px;font-weight:700;letter-spacing:1px}
    .ldot{width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 8px #22c55e;animation:blink 1s infinite}
    .el{color:#888;font-size:13px;font-family:'Space Mono',monospace}
    .stop-btn{background:none;border:1px solid #333;color:#888;border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer;font-family:inherit}
    .bpm-c{display:flex;flex-direction:column;align-items:center;margin-bottom:12px}
    .zlbl{margin-top:6px;font-size:13px;font-weight:700}
    .song-card{background:#12122a;border:1px solid #2a2a4a;border-radius:18px;padding:16px;transition:border-color .4s;margin-bottom:10px}
    .song-card.warn{border-color:var(--zc) !important}
    .zbadge{display:inline-flex;align-items:center;padding:4px 12px;border-radius:8px;font-size:12px;font-weight:700;letter-spacing:1px;margin-bottom:12px}
    .wlbl{font-size:12px;font-weight:700;animation:pulse .8s infinite}
    .srow{display:flex;align-items:center;gap:12px;margin-bottom:14px}
    .art{width:52px;height:52px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;overflow:hidden}
    .art img{width:100%;height:100%;object-fit:cover}
    .stitle{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .sartist{font-size:12px;color:#aaa;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .sbpm{font-size:13px;font-weight:700;font-family:'Space Mono',monospace;white-space:nowrap}
    .prog-t{height:5px;background:#1a1a2e;border-radius:3px;overflow:hidden;margin-bottom:8px}
    .prog-f{height:100%;border-radius:3px;transition:width 1s linear,background .4s}
    .cfooter{display:flex;justify-content:space-between;align-items:center}
    .tleft{color:#666;font-size:12px;font-family:'Space Mono',monospace}
    .skip-btn{background:none;border:1px solid #333;color:#888;border-radius:8px;padding:4px 10px;font-size:11px;cursor:pointer;font-family:inherit}
    .upnext{background:#0a0a1a;border:1px solid #1e1e38;border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:10px;margin-bottom:14px}
    .unl{color:#555;font-size:12px;white-space:nowrap}
    .untitle{flex:1;color:#bbb;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .zpill{border-radius:6px;padding:3px 8px;font-size:11px;font-weight:700;white-space:nowrap}
    .tl-wrap{margin-bottom:14px}
    .tl-meta{color:#555;font-size:11px;margin-bottom:6px}
    .tl{display:flex;gap:3px;height:7px;border-radius:4px;overflow:hidden}
    .stats{display:flex;gap:8px;margin-bottom:16px}
    .stat{flex:1;background:#12122a;border-radius:10px;padding:8px 10px;border:1px solid #1e1e38}
    .szone{font-size:11px;font-weight:700}
    .scnt{font-size:11px;font-family:'Space Mono',monospace;color:#888;margin-top:2px}
    .credit{text-align:center;margin-top:4px}
    .credit a{color:#333;font-size:11px;text-decoration:none}
    .credit a:hover{color:#666}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>

<div class="screen active" id="s-setup">
  <div class="logo">◈ <span>rhythmrun</span></div>
  <div class="tagline">Şarkı bitmeden geçiş yok.</div>

  <div class="sec">Aktif zon</div>
  <div class="mode-grid">
    <button class="mode-btn" id="btn-run" onclick="selMode('run')">
      <div class="m-title">🏃 Koşu</div><div class="m-desc">135–165 BPM</div>
    </button>
    <button class="mode-btn" id="btn-sprint" onclick="selMode('sprint')">
      <div class="m-title">⚡ Sprint</div><div class="m-desc">168–185 BPM</div>
    </button>
  </div>

  <div class="sec">Yürüyüş / Aktif oran</div>
  <div class="ratio-list">
    <button class="ratio-btn" onclick="selRatio('1-1',1,1)">
      <span class="rl">1 : 1</span><span class="rd">1 yürüyüş · 1 aktif</span>
      <div class="dots"><div class="dw"></div><div class="da-run" id="d11"></div></div>
    </button>
    <button class="ratio-btn" onclick="selRatio('1-2',1,2)">
      <span class="rl">1 : 2</span><span class="rd">1 yürüyüş · 2 aktif</span>
      <div class="dots"><div class="dw"></div><div class="da-run" id="d12a"></div><div class="da-run" id="d12b"></div></div>
    </button>
    <button class="ratio-btn" onclick="selRatio('1-3',1,3)">
      <span class="rl">1 : 3</span><span class="rd">1 yürüyüş · 3 aktif</span>
      <div class="dots"><div class="dw"></div><div class="da-run" id="d13a"></div><div class="da-run" id="d13b"></div><div class="da-run" id="d13c"></div></div>
    </button>
  </div>

  <div class="info-box">
    <span>💡</span>
    <span>Şarkılar <strong style="color:#bbb">MusicBrainz</strong>'den çekiliyor. Her şarkı sonuna kadar çalınır, <strong style="color:#bbb">15 sn önce</strong> uyarı gelir.</span>
  </div>
  <div class="err-box" id="err"></div>
  <button class="start-btn" id="start-btn" onclick="startWorkout()" disabled>▶ Antrenmanı Başlat</button>
</div>

<div class="screen" id="s-loading">
  <div class="spinner"></div>
  <div class="load-msg" id="load-msg">Yükleniyor...</div>
</div>

<div class="screen" id="s-workout">
  <div class="wk-hdr">
    <div class="live"><div class="ldot"></div>CANLI</div>
    <div class="el" id="elapsed">⏱ 0:00</div>
    <button class="stop-btn" onclick="stopWorkout()">⏹ Bitir</button>
  </div>
  <div class="bpm-c">
    <svg width="136" height="136" viewBox="0 0 136 136">
      <circle cx="68" cy="68" r="52" fill="none" stroke="#1e1e3a" stroke-width="10"/>
      <circle id="arc" cx="68" cy="68" r="52" fill="none" stroke="#22c55e" stroke-width="10"
        stroke-dasharray="0 326.7" stroke-dashoffset="81.7" stroke-linecap="round"
        style="transition:stroke-dasharray .7s ease,stroke .5s ease"/>
      <text id="bnum" x="68" y="63" text-anchor="middle" fill="white" font-size="27" font-weight="700" font-family="'Space Mono',monospace">—</text>
      <text x="68" y="80" text-anchor="middle" fill="#888" font-size="11" font-family="'DM Sans',sans-serif">BPM</text>
    </svg>
    <div class="zlbl" id="zlbl">—</div>
  </div>
  <div class="song-card" id="scard">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div class="zbadge" id="zbadge">—</div>
      <div class="wlbl" id="wlbl" style="display:none">⚠ Hazır ol!</div>
    </div>
    <div class="srow">
      <div class="art" id="sart">♪</div>
      <div style="flex:1;min-width:0">
        <div class="stitle" id="stitle">—</div>
        <div class="sartist" id="sartist">—</div>
      </div>
      <div style="text-align:right;flex-shrink:0">
        <div class="sbpm" id="sbpm">—</div>
      </div>
    </div>
    <div class="prog-t"><div class="prog-f" id="pfill" style="width:0%"></div></div>
    <div class="cfooter">
      <span class="tleft" id="tleft">—</span>
      <button class="skip-btn" onclick="skipNext()">sıradaki ⏭</button>
    </div>
  </div>
  <div class="upnext" id="upnext">
    <span class="unl">Sıradaki</span>
    <div class="art" id="nart" style="width:32px;height:32px;font-size:14px">♪</div>
    <span class="untitle" id="ntitle">—</span>
    <div class="zpill" id="npill">—</div>
  </div>
  <div class="tl-wrap">
    <div class="tl-meta" id="tlmeta">0 / 0</div>
    <div class="tl" id="tl"></div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="credit"><a href="https://getsongbpm.com" target="_blank" rel="noopener">BPM data by getsongbpm.com</a></div>
</div>

<script>
const MB = "https://musicbrainz.org/ws/2";
const AB = "https://acousticbrainz.org/api/v1";
const UA = "RhythmRun/1.0 (https://rhythmrun-app.netlify.app)";

const ZONES = {
  walk:   {min:85, max:125, label:"Yürüyüş", color:"#22c55e", emoji:"🚶"},
  run:    {min:135,max:165, label:"Koşu",     color:"#f97316", emoji:"🏃"},
  sprint: {min:168,max:190, label:"Sprint",   color:"#ef4444", emoji:"⚡"},
};

// Popular artists per zone for search queries
const WALK_ARTISTS   = ["dua lipa","bruno mars","justin timberlake","pharrell williams","mark ronson","lizzo","harry styles","ed sheeran"];
const RUN_ARTISTS    = ["kendrick lamar","eminem","queen","black eyed peas","kanye west","lady gaga","david guetta","calvin harris"];
const SPRINT_ARTISTS = ["the weeknd","olivia rodrigo","billie eilish","post malone","drake","ariana grande","taylor swift","twenty one pilots"];

let selMode_ = null, selRatio_ = null;
let queue = [], curIdx = 0, secLeft = 0, totTime = 0, elapsed = 0;
let running = false, timer = null;
const WARN = 15;
const SONG_DUR = () => 180 + Math.floor(Math.random()*120);
const mbCache = {}, abCache = {};

function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}

function selMode(m){
  selMode_=m;
  document.getElementById('btn-run').className   ='mode-btn'+(m==='run'?' sel-run':'');
  document.getElementById('btn-sprint').className='mode-btn'+(m==='sprint'?' sel-sprint':'');
  const cls = m==='sprint'?'da-sprint':'da-run';
  ['d11','d12a','d12b','d13a','d13b','d13c'].forEach(id=>{const el=document.getElementById(id);if(el)el.className=cls;});
  checkReady();
}

function selRatio(id,w,a){
  selRatio_={id,walk:w,active:a};
  document.querySelectorAll('.ratio-btn').forEach((b,i)=>b.classList.toggle('sel',['1-1','1-2','1-3'][i]===id));
  checkReady();
}

function checkReady(){document.getElementById('start-btn').disabled=!(selMode_&&selRatio_);}

function setMsg(t){document.getElementById('load-msg').textContent=t;}

// Fetch recordings from MusicBrainz for an artist
async function mbSearch(artist, limit=10){
  if(mbCache[artist]) return mbCache[artist];
  const q = encodeURIComponent(`artist:"${artist}"`);
  const url = `${MB}/recording/?query=${q}&limit=${limit}&fmt=json`;
  const res = await fetch(url, {headers:{'User-Agent':UA}});
  if(!res.ok) return [];
  const data = await res.json();
  const recs = (data.recordings||[]).map(r=>({
    id: r.id,
    title: r.title,
    artist: r['artist-credit']?.[0]?.name ?? artist,
    art: null,
  }));
  mbCache[artist] = recs;
  return recs;
}

// Fetch BPM from AcousticBrainz
async function abBpm(mbid){
  if(abCache[mbid]!==undefined) return abCache[mbid];
  try{
    const res = await fetch(`${AB}/low-level?recording_ids=${mbid}`);
    if(!res.ok){abCache[mbid]=null;return null;}
    const data = await res.json();
    const bpm = data[mbid]?.['0']?.rhythm?.bpm ?? null;
    abCache[mbid] = bpm ? Math.round(bpm) : null;
    return abCache[mbid];
  } catch{abCache[mbid]=null;return null;}
}

async function fetchZoneSongs(zone){
  const z = ZONES[zone];
  const artists = zone==='walk' ? WALK_ARTISTS : zone==='run' ? RUN_ARTISTS : SPRINT_ARTISTS;
  const songs = [];

  for(const artist of artists){
    if(songs.length >= 12) break;
    setMsg(`"${artist}" şarkıları aranıyor...`);
    const recs = await mbSearch(artist, 15);

    // Check BPM for each recording
    for(const rec of recs){
      if(songs.length >= 12) break;
      const bpm = await abBpm(rec.id);
      if(bpm && bpm >= z.min && bpm <= z.max){
        songs.push({...rec, bpm});
      }
    }
    // Small delay to respect rate limit
    await new Promise(r=>setTimeout(r,200));
  }
  return songs;
}

function pick(pool, count, usedIds){
  const avail = pool.filter(s=>!usedIds.includes(s.id));
  const src = avail.length>=count ? avail : pool;
  return [...src].sort(()=>Math.random()-.5).slice(0,count);
}

async function startWorkout(){
  document.getElementById('err').style.display='none';
  show('s-loading');
  try{
    setMsg('Yürüyüş şarkıları aranıyor...');
    const walkSongs = await fetchZoneSongs('walk');

    setMsg((selMode_==='sprint'?'Sprint':'Koşu')+' şarkıları aranıyor...');
    const activeSongs = await fetchZoneSongs(selMode_);

    if(!walkSongs.length || !activeSongs.length) throw new Error('Yeterli şarkı bulunamadı. Lütfen tekrar deneyin.');

    setMsg('Playlist hazırlanıyor...');
    queue=[];
    const used=[];
    for(let r=0;r<5;r++){
      pick(walkSongs,selRatio_.walk,used).forEach(s=>{queue.push({zone:'walk',song:s,dur:SONG_DUR()});used.push(s.id);});
      pick(activeSongs,selRatio_.active,used).forEach(s=>{queue.push({zone:selMode_,song:s,dur:SONG_DUR()});used.push(s.id);});
    }
    curIdx=0; secLeft=queue[0].dur; totTime=queue[0].dur; elapsed=0; running=true;
    render();
    startTimer();
    show('s-workout');
  } catch(e){
    show('s-setup');
    const eb=document.getElementById('err');
    eb.style.display='block';
    eb.textContent='⚠ '+e.message;
  }
}

function startTimer(){
  clearInterval(timer);
  timer=setInterval(()=>{
    secLeft--; elapsed++;
    if(secLeft<=0){
      curIdx++;
      if(curIdx>=queue.length){stopWorkout();return;}
      secLeft=queue[curIdx].dur; totTime=queue[curIdx].dur;
    }
    render();
  },1000);
}

function stopWorkout(){clearInterval(timer);running=false;show('s-setup');}

function skipNext(){
  curIdx++;
  if(curIdx>=queue.length){stopWorkout();return;}
  secLeft=queue[curIdx].dur; totTime=queue[curIdx].dur;
  render();
}

function render(){
  const slot=queue[curIdx]; if(!slot)return;
  const {zone,song}=slot;
  const z=ZONES[zone];
  const warn=secLeft<=WARN;
  const circ=2*Math.PI*52;
  const pct=Math.min(song.bpm/210,1);

  document.getElementById('arc').setAttribute('stroke-dasharray',`${circ*pct} ${circ*(1-pct)}`);
  document.getElementById('arc').setAttribute('stroke',z.color);
  document.getElementById('bnum').textContent=song.bpm;
  document.getElementById('zlbl').textContent=z.emoji+' '+z.label;
  document.getElementById('zlbl').style.color=z.color;

  const sc=document.getElementById('scard');
  sc.style.setProperty('--zc',z.color);
  sc.classList.toggle('warn',warn);

  const badge=document.getElementById('zbadge');
  badge.textContent=z.emoji+' '+z.label.toUpperCase();
  badge.style.cssText=`background:${z.color}22;color:${z.color};display:inline-flex;align-items:center;padding:4px 12px;border-radius:8px;font-size:12px;font-weight:700;letter-spacing:1px;margin-bottom:12px`;

  const wl=document.getElementById('wlbl');
  wl.style.display=warn?'block':'none';
  wl.style.color=z.color;

  const artEl=document.getElementById('sart');
  artEl.style.background=z.color+'22';
  artEl.innerHTML=song.art?`<img src="${song.art}" onerror="this.parentNode.innerHTML='♪'" alt="">`:`<span style="color:${z.color}">♪</span>`;

  document.getElementById('stitle').textContent=song.title;
  document.getElementById('sartist').textContent=song.artist;
  document.getElementById('sbpm').textContent=song.bpm+' BPM';
  document.getElementById('sbpm').style.color=z.color;

  const prog=1-secLeft/totTime;
  const pf=document.getElementById('pfill');
  pf.style.width=(prog*100)+'%';
  pf.style.background=warn?z.color:z.color+'aa';

  const m=Math.floor(secLeft/60),s=secLeft%60;
  document.getElementById('tleft').textContent=`${m}:${String(s).padStart(2,'0')} kaldı`;

  const em=Math.floor(elapsed/60),es=elapsed%60;
  document.getElementById('elapsed').textContent=`⏱ ${em}:${String(es).padStart(2,'0')}`;

  const next=queue[curIdx+1];
  if(next){
    const nz=ZONES[next.zone];
    const na=document.getElementById('nart');
    na.style.background=nz.color+'22';
    na.innerHTML=next.song.art?`<img src="${next.song.art}" onerror="this.parentNode.innerHTML='♪'" alt="" style="width:100%;height:100%;object-fit:cover">`:`<span style="color:${nz.color}">♪</span>`;
    document.getElementById('ntitle').innerHTML=`${next.song.title} <span style="color:#555">· ${next.song.artist}</span>`;
    const np=document.getElementById('npill');
    np.textContent=nz.emoji+' '+nz.label;
    np.style.cssText=`background:${nz.color}22;color:${nz.color};border-radius:6px;padding:3px 8px;font-size:11px;font-weight:700;white-space:nowrap`;
    document.getElementById('upnext').style.display='flex';
  } else {
    document.getElementById('upnext').style.display='none';
  }

  document.getElementById('tlmeta').textContent=`${curIdx+1} / ${queue.length} şarkı`;
  document.getElementById('tl').innerHTML=queue.map((sl,i)=>{
    const tz=ZONES[sl.zone];
    const bg=i===curIdx?tz.color:i<curIdx?tz.color+'44':tz.color+'28';
    const out=i===curIdx?`outline:2px solid ${tz.color};outline-offset:1px`:'';
    return `<div style="flex:1;background:${bg};border-radius:2px;${out};transition:background .4s"></div>`;
  }).join('');

  const zones=[...new Set(queue.map(s=>s.zone))];
  document.getElementById('stats').innerHTML=zones.map(zn=>{
    const zt=ZONES[zn];
    const done=queue.filter((s,i)=>s.zone===zn&&i<=curIdx).length;
    const total=queue.filter(s=>s.zone===zn).length;
    return `<div class="stat"><div class="szone" style="color:${zt.color}">${zt.emoji} ${zt.label}</div><div class="scnt">${done}/${total}</div></div>`;
  }).join('');
}
</script>
</body>
</html>
